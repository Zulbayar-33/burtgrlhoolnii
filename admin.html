<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Admin Pending Approval</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">
  <div class="card shadow p-4">
    <h3 class="mb-3">Pending хоолны бүртгэл</h3>

    <button class="btn btn-primary mb-3" onclick="loadPending()">
      Pending жагсаалт шинэчлэх
    </button>

    <div id="list"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxa21x3nx3Ok2jBWPzu5pUllEWJhs7fjYtrHtHsWBbsLBmXwHGOrX2c-6oXUqtdYsjMjA/exec";

async function loadPending() {
  const list = document.getElementById("list");
  list.innerHTML = "Уншиж байна...";

  try {
    const res = await fetch(API_URL + "?action=pending");
    const data = await res.json();

    if (!data.success || !data.items || data.items.length === 0) {
      list.innerHTML = "<div class='alert alert-info'>Pending бүртгэл байхгүй</div>";
      return;
    }

    let html = `
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>№</th>
            <th>Овог</th>
            <th>Нэр</th>
            <th>Албан тушаал</th>
            <th>Огноо</th>
            <th>Үйлдэл</th>
          </tr>
        </thead>
        <tbody>
    `;

    data.items.forEach(item => {
      html += `
        <tr>
          <td>${item.no}</td>
          <td>${item.ovog}</td>
          <td>${item.ner}</td>
          <td>${item.job}</td>
          <td>${item.date}</td>
          <td>
            <button class="btn btn-success btn-sm" onclick="adminAction(${item.row}, '${item.date}', 'accept')">
              Approve
            </button>

            <button class="btn btn-danger btn-sm" onclick="adminAction(${item.row}, '${item.date}', 'reject')">
              Reject
            </button>

            <button class="btn btn-secondary btn-sm" onclick="adminAction(${item.row}, '${item.date}', 'remove')">
              Remove
            </button>
          </td>
        </tr>
      `;
    });

    html += "</tbody></table>";
    list.innerHTML = html;

  } catch (err) {
    console.log(err);
    list.innerHTML = "<div class='alert alert-danger'>Pending жагсаалт уншихад алдаа гарлаа</div>";
  }
}

async function adminAction(row, date, decision) {
  if (!confirm("Are you sure? " + decision)) return;

  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({
        action: "admin",
        row: row,
        date: date,
        adminDecision: decision
      })
    });

    alert("Saved. Please refresh.");
    loadPending();

  } catch (err) {
    console.log(err);
    alert("Apps Script холболт алдаа");
  }
}

loadPending();
</script>

</body>
</html>
