<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Admin Pending Approval</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .table-wrap {
      overflow-x:auto;
    }

    @media (max-width:700px) {
      .btn-sm {
        display:block;
        width:100%;
        margin-bottom:5px;
      }
    }
  </style>
</head>

<body class="bg-light">

<div class="container mt-4">
  <div class="card shadow p-4">
    <h3 class="mb-3">Pending хоолны бүртгэл</h3>

    <button class="btn btn-primary mb-3" onclick="loadPending()">
      Pending жагсаалт шинэчлэх
    </button>

    <a href="?" class="btn btn-secondary mb-3">
      Form руу буцах
    </a>

    <div id="list">Уншиж байна...</div>
  </div>
</div>

<script>
window.onload = loadPending;

function loadPending() {
  const list = document.getElementById("list");
  list.innerHTML = "Уншиж байна...";

  google.script.run
    .withSuccessHandler(function(items) {
      items = items || [];

      if (items.length === 0) {
        list.innerHTML = "<div class='alert alert-info'>Pending бүртгэл байхгүй</div>";
        return;
      }

      let html = `
        <div class="table-wrap">
        <table class="table table-bordered table-striped">
          <thead>
            <tr>
              <th>№</th>
              <th>Код</th>
              <th>Овог</th>
              <th>Нэр</th>
              <th>Албан тушаал</th>
              <th>Огноо</th>
              <th>Үйлдэл</th>
            </tr>
          </thead>
          <tbody>
      `;

      items.forEach(function(item) {
        html += `
          <tr>
            <td>${item.no || ""}</td>
            <td>${item.code || ""}</td>
            <td>${item.ovog || ""}</td>
            <td>${item.ner || ""}</td>
            <td>${item.job || ""}</td>
            <td>${item.date || ""}</td>
            <td>
              <button class="btn btn-success btn-sm" onclick="adminAction(${item.row}, '${item.date}', 'accept')">
                Approve
              </button>
              <button class="btn btn-danger btn-sm" onclick="adminAction(${item.row}, '${item.date}', 'reject')">
                Reject
              </button>
              <button class="btn btn-secondary btn-sm" onclick="adminAction(${item.row}, '${item.date}', 'remove')">
                Remove
              </button>
            </td>
          </tr>
        `;
      });

      html += "</tbody></table></div>";
      list.innerHTML = html;
    })
    .withFailureHandler(function(err) {
      list.innerHTML =
        "<div class='alert alert-danger'>Pending унших алдаа: " + err.message + "</div>";
    })
    .getPendingList();
}

function adminAction(row, date, decision) {
  if (!confirm("Are you sure? " + decision)) return;

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        alert(res.message);
        loadPending();
      } else {
        alert((res && res.message) ? res.message : "Алдаа");
      }
    })
    .withFailureHandler(function(err) {
      alert("Алдаа: " + err.message);
    })
    .adminAction({
      row: row,
      date: date,
      adminDecision: decision
    });
}
</script>

</body>
</html>
