<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Хоол идсэн бүртгэл</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background:#f4f6f9;
      font-family:Arial,sans-serif;
    }

    .box {
      max-width:700px;
      margin:25px auto;
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    .title {
      font-weight:700;
      text-align:center;
      margin-bottom:20px;
    }

    #msg {
      font-weight:700;
      margin-top:15px;
      text-align:center;
    }

    @media (max-width:600px) {
      .box {
        margin:10px;
        padding:18px;
      }

      .input-group {
        display:block;
      }

      .input-group input,
      .input-group button {
        width:100%;
        border-radius:8px !important;
        margin-top:8px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="box">

    <h3 class="title">Хоол идсэн бүртгэл</h3>

    <label class="form-label">Ажилтан хайх</label>
    <div class="input-group mb-3">
      <input type="text" id="searchInput" class="form-control" placeholder="Код, нэр, овог хайх...">
      <button class="btn btn-primary" onclick="filterEmployees()">Хайх</button>
    </div>

    <label class="form-label">Ажилтан сонгох</label>
    <select id="employee" class="form-select mb-3">
      <option value="">Ажилтан татаж байна...</option>
    </select>

    <label class="form-label">Огноо сонгох</label>
    <input type="date" id="datePicker" class="form-control mb-3">

    <button id="saveBtn" class="btn btn-success w-100" onclick="saveStatus()">
      🍱 Хоол идсэн
    </button>

    <div id="msg">Ажилтан татаж байна...</div>

  </div>
</div>

<script>
let allEmployees = [];

window.addEventListener("load", function () {
  google.script.run
    .withSuccessHandler(function(employees) {
      allEmployees = employees || [];
      renderEmployees(allEmployees);

      document.getElementById("msg").innerHTML =
        "<span class='text-success'>Ажилтан татагдлаа: " + allEmployees.length + "</span>";
    })
    .withFailureHandler(function(err) {
      document.getElementById("employee").innerHTML =
        '<option value="">Ажилтан татах алдаа</option>';

      document.getElementById("msg").innerHTML =
        "<span class='text-danger'>Ажилтан татах алдаа: " + err.message + "</span>";
    })
    .getEmployees();

  document.getElementById("searchInput").addEventListener("keyup", function(e) {
    if (e.key === "Enter") {
      filterEmployees();
    }
  });
});

function renderEmployees(employees) {
  const select = document.getElementById("employee");
  select.innerHTML = '<option value="">Ажилтан сонгоно уу</option>';

  employees.forEach(emp => {
    const option = document.createElement("option");

    option.value = emp.code || "";
    option.dataset.code = emp.code || "";

    option.textContent = emp.display || (
      emp.no + ". " + emp.code + " - " + emp.ovog + " " + emp.ner + " - " + emp.job
    );

    select.appendChild(option);
  });
}

function filterEmployees() {
  const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

  if (!keyword) {
    renderEmployees(allEmployees);
    return;
  }

  const filtered = allEmployees.filter(emp => {
    const text = emp.search || "";
    return text.includes(keyword);
  });

  renderEmployees(filtered);

  document.getElementById("msg").innerHTML =
    "<span class='text-info'>Олдсон: " + filtered.length + "</span>";

  if (filtered.length === 1) {
    document.getElementById("employee").selectedIndex = 1;
  }
}

function getSelectedDate() {
  const value = document.getElementById("datePicker").value;

  if (!value) return "";

  const parts = value.split("-");
  return Number(parts[1]) + "/" + Number(parts[2]);
}

function saveStatus() {
  const employee = document.getElementById("employee");
  const selected = employee.options[employee.selectedIndex];
  const date = getSelectedDate();
  const msg = document.getElementById("msg");
  const saveBtn = document.getElementById("saveBtn");

  const code = selected ? (selected.dataset.code || selected.value || "") : "";

  if (!code) {
    msg.innerHTML = "<span class='text-danger'>Ажилтан сонгоно уу</span>";
    return;
  }

  if (!date) {
    msg.innerHTML = "<span class='text-danger'>Огноо сонгоно уу</span>";
    return;
  }

  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  const startMinutes = 9 * 60;
  const endMinutes = 11 * 60 + 30;

  let actionStatus = "approved";

  if (currentMinutes < startMinutes || currentMinutes > endMinutes) {
    alert("Sorry, you are late for lunch. Admin approval pending.");
    actionStatus = "pending";
  }

  saveBtn.disabled = true;
  msg.innerHTML = "Хадгалж байна...";

  google.script.run
    .withSuccessHandler(function(res) {
      saveBtn.disabled = false;

      if (res && res.success) {
        msg.innerHTML = "<span class='text-success'>" + res.message + "</span>";
      } else {
        msg.innerHTML =
          "<span class='text-danger'>" + ((res && res.message) ? res.message : "Алдаа") + "</span>";
      }
    })
    .withFailureHandler(function(err) {
      saveBtn.disabled = false;
      msg.innerHTML = "<span class='text-danger'>Алдаа: " + err.message + "</span>";
    })
    .saveLunch({
      code: code,
      date: date,
      actionStatus: actionStatus
    });
}
</script>

</body>
</html>
